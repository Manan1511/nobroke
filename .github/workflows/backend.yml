name: Backend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Start local Supabase
        run: npx supabase start --exclude studio,edge-runtime,logflare,vector
      - name: Run database contract tests
        run: npx supabase test db --local
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
